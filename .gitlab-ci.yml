default:
  tags:
    - shared

stages:
  - test
  - build
  - deploy

test:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm run check
    - npm test
    - cd api
    - npm ci
    - npx tsc --noEmit
    - npm test

build:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --build-arg CI_COMMIT_SHA=$CI_COMMIT_SHA -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:latest"

deploy:
  stage: deploy
  image: node:20-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - wget -q -O- --post-data='' "$PORTAINER_WEBHOOK_URL"
